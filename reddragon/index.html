<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RedDragon | Kapustiack</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>
    <main class="app-shell">
        <section class="hero">
            <p class="kicker">Kapustiack_Dev</p>
            <h1>RedDragon</h1>
            <p class="subtext">Fast public diagnostics. Results are returned by the bot in chat.</p>
        </section>

        <section class="panel">
            <div class="field">
                <label for="tool">Tool</label>
                <select id="tool">
                    <option value="ip">IP lookup</option>
                    <option value="dns">DNS lookup</option>
                    <option value="whois">Domain lookup</option>
                    <option value="headers">HTTP headers</option>
                    <option value="ssl">SSL certificate</option>
                    <option value="subdomains">Subdomains</option>
                    <option value="hash">Hash text</option>
                    <option value="encode">Encode text</option>
                    <option value="decode">Decode text</option>
                    <option value="url">URL inspect</option>
                </select>
            </div>

            <div class="field">
                <label for="input">Input</label>
                <textarea id="input" rows="4" placeholder="example.com"></textarea>
            </div>

            <div class="actions">
                <button id="send" type="button">Run Tool</button>
                <button id="clear" class="ghost" type="button">Clear</button>
            </div>
        </section>

        <section class="tools-grid" aria-label="Quick tools">
            <button class="tool-chip active" data-tool="ip" data-placeholder="1.1.1.1">IP</button>
            <button class="tool-chip" data-tool="dns" data-placeholder="example.com">DNS</button>
            <button class="tool-chip" data-tool="whois" data-placeholder="example.com">Domain</button>
            <button class="tool-chip" data-tool="headers" data-placeholder="https://example.com">Headers</button>
            <button class="tool-chip" data-tool="ssl" data-placeholder="example.com">SSL</button>
            <button class="tool-chip" data-tool="subdomains" data-placeholder="example.com">Subs</button>
            <button class="tool-chip" data-tool="hash" data-placeholder="text to hash">Hash</button>
            <button class="tool-chip" data-tool="encode" data-placeholder="text to encode">Encode</button>
            <button class="tool-chip" data-tool="decode" data-placeholder="base64 or url encoded text">Decode</button>
            <button class="tool-chip" data-tool="url" data-placeholder="https://example.com/path">URL</button>
        </section>

        <p class="status" id="status">Open from the bot keyboard for live results.</p>
    </main>

    <script src="app.js"></script>
</body>

</html>
